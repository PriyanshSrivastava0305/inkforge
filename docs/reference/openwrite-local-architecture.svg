<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1120" height="760" fill="#f8fafc"/>

  <text x="560" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">OpenWrite — Fully Local Architecture</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#64748b">No cloud, no external API, no API keys · everything runs on your own machine</text>

  <!-- Boundary -->
  <rect x="20" y="72" width="1080" height="492" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="38" y="92" font-size="12" font-weight="700" fill="#166534">YOUR MACHINE / LAN — zero outbound traffic</text>

  <!-- ===== Col 1: Browser ===== -->
  <rect x="40" y="106" width="250" height="400" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">apps/web — React SPA</text>
  <text x="165" y="144" text-anchor="middle" font-size="11" fill="#475569">Browser · localhost:3000</text>

  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="56" y="156" width="218" height="38" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="172" font-weight="600">Local Auth &amp; Workspaces</text><text x="165" y="186" font-size="11" fill="#64748b">single-user or household accounts</text>

    <rect x="56" y="203" width="218" height="38" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="219" font-weight="600">Projects &amp; Chapters</text><text x="165" y="233" font-size="11" fill="#64748b">goals, reorder, progress</text>

    <rect x="56" y="250" width="218" height="38" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="266" font-weight="600">Tiptap Editor</text><text x="165" y="280" font-size="11" fill="#64748b">auto-save · word count</text>

    <rect x="56" y="297" width="218" height="38" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="313" font-weight="600">Story Map Canvas</text><text x="165" y="327" font-size="11" fill="#64748b">AI-expanded node graph</text>

    <rect x="56" y="344" width="218" height="38" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="360" font-weight="600">Codex</text><text x="165" y="374" font-size="11" fill="#64748b">characters · lore · locations</text>

    <rect x="56" y="391" width="218" height="38" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="407" font-weight="600">AI Assistant Chat</text><text x="165" y="421" font-size="11" fill="#64748b">streams tokens as they generate</text>

    <rect x="56" y="438" width="218" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="165" y="456" font-weight="600">Settings (changed)</text><text x="165" y="471" font-size="11" fill="#64748b">LLM endpoint URL + model picker</text><text x="165" y="484" font-size="11" fill="#64748b">no API keys · Markdown export</text>
  </g>

  <!-- ===== Col 2: Local server ===== -->
  <rect x="345" y="106" width="350" height="440" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="520" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">apps/server — Hono on Bun</text>
  <text x="520" y="144" text-anchor="middle" font-size="11" fill="#64748b">long-running local process (replaces Cloudflare Worker)</text>

  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="362" y="156" width="316" height="38" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="520" y="172" font-weight="600">Static file server</text><text x="520" y="186" font-size="11" fill="#64748b">serves built SPA from apps/web/dist</text>

    <rect x="362" y="203" width="316" height="38" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="520" y="219" font-weight="600">Middleware</text><text x="520" y="233" font-size="11" fill="#64748b">CORS · Better Auth sessions (local)</text>

    <rect x="362" y="250" width="316" height="52" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="520" y="268" font-weight="600">Route handlers</text>
    <text x="520" y="284" font-size="11" fill="#64748b">projects · chapters · codex · story map</text>
    <text x="520" y="296" font-size="11" fill="#64748b">AI chat / expand (SSE) · export</text>

    <rect x="362" y="311" width="316" height="52" rx="8" fill="#ffedd5" stroke="#f97316"/>
    <text x="520" y="329" font-weight="600">Context builder (new)</text>
    <text x="520" y="345" font-size="11" fill="#64748b">project + genre + characters + codex</text>
    <text x="520" y="357" font-size="11" fill="#64748b">trimmed to the model's context window</text>

    <rect x="362" y="372" width="316" height="64" rx="8" fill="#ffedd5" stroke="#f97316"/>
    <text x="520" y="390" font-weight="600">LLM adapter (changed)</text>
    <text x="520" y="406" font-size="11" fill="#64748b">one OpenAI-compatible client → LLM_BASE_URL</text>
    <text x="520" y="418" font-size="11" fill="#64748b">streaming · request queue · timeouts</text>
    <text x="520" y="430" font-size="11" fill="#64748b">health check + model list</text>

    <rect x="362" y="446" width="316" height="48" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="520" y="464" font-weight="600">Drizzle ORM</text><text x="520" y="480" font-size="11" fill="#64748b">bun:sqlite driver · migrations</text>

    <rect x="362" y="504" width="316" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="520" y="523" font-size="11" fill="#64748b">AES-GCM key vault: no longer needed</text>
  </g>

  <!-- ===== Col 3 top: Local LLM runtime ===== -->
  <rect x="760" y="106" width="320" height="300" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="920" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Local LLM runtime</text>
  <text x="920" y="144" text-anchor="middle" font-size="11" fill="#475569">separate process or container · no internet needed</text>

  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="778" y="156" width="284" height="48" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="920" y="176" font-weight="600">Ollama  ·  :11434</text><text x="920" y="192" font-size="11" fill="#64748b">default · exposes /v1 OpenAI-compatible API</text>

    <rect x="778" y="212" width="284" height="48" rx="8" fill="#fff" stroke="#c4b5fd" stroke-dasharray="5 3"/>
    <text x="920" y="232" font-weight="600">Alternatives</text><text x="920" y="248" font-size="11" fill="#64748b">llama.cpp server · LM Studio · vLLM</text>

    <rect x="778" y="268" width="284" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="920" y="288" font-weight="600">Model weights (GGUF) on disk</text>
    <text x="920" y="304" font-size="11" fill="#64748b">e.g. Llama 3, Qwen, Mistral, Gemma</text>
    <text x="920" y="318" font-size="11" fill="#64748b">pick by RAM/VRAM: 8B ≈ 8 GB · 70B ≈ 48 GB+</text>

    <rect x="778" y="336" width="284" height="56" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="920" y="356" font-weight="600">Hardware</text>
    <text x="920" y="372" font-size="11" fill="#64748b">Apple Metal · NVIDIA CUDA · AMD ROCm · CPU</text>
    <text x="920" y="385" font-size="11" fill="#64748b">GPU strongly recommended</text>
  </g>

  <!-- ===== Col 3 bottom: SQLite ===== -->
  <g>
    <path d="M760,452 v82 a160,12 0 0 0 320,0 v-82" fill="#fff" stroke="#16a34a" stroke-width="1.4"/>
    <ellipse cx="920" cy="452" rx="160" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="920" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">SQLite file (replaces D1)</text>
    <text x="920" y="500" text-anchor="middle" font-size="11" fill="#64748b">data/openwrite.db · Docker volume or local folder</text>
    <text x="920" y="516" text-anchor="middle" font-size="11" fill="#64748b">users · projects · chapters · codex · story nodes</text>
  </g>

  <!-- ===== Arrows ===== -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M290,230 H343" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M678,404 H758" marker-end="url(#arr)"/>
    <path d="M678,470 H920 V472" marker-end="url(#arr)" />
  </g>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="316" y="222">HTTP</text>
    <text x="316" y="246">+ SSE</text>
    <text x="718" y="396">/v1/chat</text>
    <text x="718" y="420">stream</text>
    <text x="760" y="462" text-anchor="start" fill="#334155">SQL</text>
  </g>

  <!-- ===== What changed ===== -->
  <text x="30" y="590" font-size="13" font-weight="700" fill="#0f172a">What changes vs. the cloud version</text>
  <g font-size="11.5" text-anchor="start">
    <rect x="30" y="602" width="200" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="44" y="624" fill="#94a3b8">was: Cloudflare Worker</text><text x="44" y="645" font-weight="600" fill="#0f172a">now: Bun + Hono process</text>

    <rect x="245" y="602" width="200" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="259" y="624" fill="#94a3b8">was: D1 (hosted SQLite)</text><text x="259" y="645" font-weight="600" fill="#0f172a">now: local SQLite file</text>

    <rect x="460" y="602" width="200" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="474" y="624" fill="#94a3b8">was: 7 cloud providers + keys</text><text x="474" y="645" font-weight="600" fill="#0f172a">now: 1 local endpoint</text>

    <rect x="675" y="602" width="200" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="689" y="624" fill="#94a3b8">was: encrypted API keys</text><text x="689" y="645" font-weight="600" fill="#0f172a">now: nothing secret to store</text>

    <rect x="890" y="602" width="200" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="904" y="624" fill="#94a3b8">was: wrangler deploy</text><text x="904" y="645" font-weight="600" fill="#0f172a">now: docker compose up</text>
  </g>

  <text x="30" y="696" font-size="12" fill="#334155">Run: <tspan font-family="monospace" fill="#0f172a">ollama pull llama3.1:8b</tspan>  →  set <tspan font-family="monospace" fill="#0f172a">LLM_BASE_URL=http://localhost:11434/v1</tspan>  →  <tspan font-family="monospace" fill="#0f172a">bun dev</tspan></text>
  <text x="30" y="716" font-size="12" fill="#334155">Optional docker-compose services: <tspan font-family="monospace" fill="#0f172a">app</tspan> (Bun + built SPA) · <tspan font-family="monospace" fill="#0f172a">ollama</tspan> (GPU passthrough) · <tspan font-family="monospace" fill="#0f172a">./data</tspan> volume</text>

  <text x="560" y="745" text-anchor="middle" font-size="11" fill="#94a3b8">Proposed redesign of github.com/ilrein/openwrite for offline, self-contained use</text>
</svg>
