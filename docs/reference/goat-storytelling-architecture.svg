<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1120" height="740" fill="#f8fafc"/>

  <text x="560" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">GOAT-Storytelling-Agent — Architecture</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#64748b">Python library · top-down story pipeline (spec → outline → scenes → text) over any text-generation endpoint</text>

  <!-- ===== Col 1: Inputs ===== -->
  <text x="30" y="104" font-size="12" font-weight="700" fill="#1e3a8a">INPUTS</text>
  <g font-size="12.5" fill="#0f172a">
    <rect x="30" y="114" width="200" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="130" y="136" text-anchor="middle" font-weight="700">User / caller script</text>
    <text x="130" y="154" text-anchor="middle" font-size="11" fill="#64748b">topic seed, e.g. "treasure hunt</text>
    <text x="130" y="168" text-anchor="middle" font-size="11" fill="#64748b">in a jungle" · form='novel'</text>

    <rect x="30" y="206" width="200" height="96" rx="10" fill="#fff" stroke="#93c5fd" stroke-dasharray="5 3"/>
    <text x="130" y="228" text-anchor="middle" font-weight="700">Granular control</text>
    <text x="130" y="246" text-anchor="middle" font-size="11" fill="#64748b">call any stage on its own,</text>
    <text x="130" y="260" text-anchor="middle" font-size="11" fill="#64748b">edit the spec or plan by hand,</text>
    <text x="130" y="274" text-anchor="middle" font-size="11" fill="#64748b">add custom book_spec fields</text>

    <rect x="30" y="520" width="200" height="76" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="130" y="542" text-anchor="middle" font-weight="700">config.py</text>
    <text x="130" y="560" text-anchor="middle" font-size="11" fill="#64748b">text-generation endpoint</text>
    <text x="130" y="574" text-anchor="middle" font-size="11" fill="#64748b">+ Hugging Face access token</text>
  </g>

  <!-- ===== Col 2: Package ===== -->
  <rect x="290" y="90" width="400" height="562" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="490" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">goat_storytelling_agent  (Python package)</text>

  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="310" y="120" width="360" height="46" rx="8" fill="#ffedd5" stroke="#f97316"/>
    <text x="490" y="139" font-weight="700">StoryAgent  ·  storytelling_agent.py</text>
    <text x="490" y="155" font-size="11" fill="#64748b">orchestrator · generate_story(topic) runs the whole pipeline</text>

    <rect x="310" y="178" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="195" font-weight="600">1 · init_book_spec</text><text x="490" y="210" font-size="11" fill="#64748b">genre, place, time, theme, tone, POV, characters, premise</text>

    <rect x="310" y="228" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="245" font-weight="600">2 · enhance_book_spec</text><text x="490" y="260" font-size="11" fill="#64748b">LLM refines and enriches the spec</text>

    <rect x="310" y="278" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="295" font-weight="600">3 · create_plot_chapters</text><text x="490" y="310" font-size="11" fill="#64748b">acts → chapter-by-chapter outline</text>

    <rect x="310" y="328" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="345" font-weight="600">4 · enhance_plot_chapters</text><text x="490" y="360" font-size="11" fill="#64748b">LLM refines the outline for consistency</text>

    <rect x="310" y="378" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="395" font-weight="600">5 · split_chapters_into_scenes</text><text x="490" y="410" font-size="11" fill="#64748b">characters, place, time, event, conflict, mood, outcome</text>

    <rect x="310" y="428" width="360" height="40" rx="8" fill="#ffedd5" stroke="#f97316"/>
    <text x="490" y="445" font-weight="700">6 · write_a_scene  (loop over every scene)</text><text x="490" y="460" font-size="11" fill="#64748b">uses previous_scene for continuity · continue_a_scene if cut off</text>

    <rect x="310" y="482" width="360" height="44" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="500" font-weight="600">Plan  ·  plan.py</text><text x="490" y="516" font-size="11" fill="#64748b">acts → chapters → scenes · Plan.plan_2_str()</text>

    <rect x="310" y="538" width="360" height="44" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="556" font-weight="600">Backend adapters</text><text x="490" y="572" font-size="11" fill="#64748b">llama.cpp · HF TGI · extensible to any engine</text>

    <rect x="310" y="594" width="360" height="44" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="612" font-weight="600">HF tokenizer</text><text x="490" y="628" font-size="11" fill="#64748b">counts tokens to fit prompts in the context window</text>
  </g>

  <!-- vertical flow arrows between stages -->
  <g stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M490,166 V177"/><path d="M490,218 V227"/><path d="M490,268 V277"/>
    <path d="M490,318 V327"/><path d="M490,368 V377"/><path d="M490,418 V427"/>
  </g>

  <!-- ===== Col 3 ===== -->
  <text x="760" y="104" font-size="12" font-weight="700" fill="#4c1d95">OUTPUTS &amp; EXTERNAL SERVICES</text>
  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="760" y="114" width="330" height="64" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text x="925" y="136" font-weight="700">Novella dataset (demo)</text>
    <text x="925" y="154" font-size="11" fill="#64748b">20 books generated from one topic each,</text>
    <text x="925" y="167" font-size="11" fill="#64748b">hosted as a Hugging Face dataset</text>

    <rect x="760" y="372" width="330" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="925" y="394" font-weight="700" fill="#166534">Generated story</text>
    <text x="925" y="412" font-size="11" fill="#64748b">list of scene texts → full novel / novella</text>
    <text x="925" y="425" font-size="11" fill="#64748b">(or any granular artifact: spec, plan, scene)</text>

    <rect x="760" y="466" width="330" height="76" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
    <text x="925" y="488" font-weight="700" fill="#4c1d95">LLM  ·  GOAT-70B-Storytelling</text>
    <text x="925" y="506" font-size="11" fill="#64748b">default open model tuned for long-form fiction</text>
    <text x="925" y="520" font-size="11" fill="#64748b">(any standard text-generation LLM works)</text>

    <rect x="760" y="556" width="330" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
    <text x="925" y="578" font-weight="700" fill="#4c1d95">Text-generation server</text>
    <text x="925" y="596" font-size="11" fill="#64748b">llama.cpp server or HF TGI</text>
    <text x="925" y="609" font-size="11" fill="#64748b">e.g. http://localhost:8080</text>

    <rect x="760" y="634" width="330" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="925" y="656" font-weight="700" fill="#1e3a8a">Hugging Face Hub</text>
    <text x="925" y="674" font-size="11" fill="#64748b">tokenizer download (needs access token)</text>
  </g>

  <!-- ===== Arrows ===== -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M230,142 H308"/>
    <path d="M230,254 H308" stroke-dasharray="5 3"/>
    <path d="M230,560 H308"/>
    <path d="M670,448 H715 V404 H758"/>
    <path d="M670,560 H725 V588 H758"/>
    <path d="M670,616 H712 V662 H758"/>
    <path d="M925,556 V543"/>
  </g>
  <g font-size="11" fill="#334155">
    <text x="236" y="556">endpoint</text>
    <text x="931" y="552" text-anchor="start" font-size="10.5">loads</text>
  </g>

  <text x="560" y="722" text-anchor="middle" font-size="11" fill="#94a3b8">Based on github.com/GOAT-AI-lab/GOAT-Storytelling-Agent README · MIT license</text>
</svg>
