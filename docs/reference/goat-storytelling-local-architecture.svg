<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1120" height="760" fill="#f8fafc"/>

  <text x="560" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">GOAT-Storytelling-Agent — Fully Local Architecture</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#64748b">Local GGUF model + llama.cpp server · offline tokenizer · all story state on disk</text>

  <!-- Boundary -->
  <rect x="16" y="72" width="1088" height="610" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="34" y="92" font-size="12" font-weight="700" fill="#166534">YOUR MACHINE — no internet needed after one-time model + tokenizer download</text>

  <!-- ===== Col 1 ===== -->
  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="30" y="108" width="200" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="130" y="130" font-weight="700">User / caller script</text>
    <text x="130" y="148" font-size="11" fill="#64748b">topic seed · form='novel'</text>
    <text x="130" y="162" font-size="11" fill="#64748b">optional CLI or small local UI</text>

    <rect x="30" y="198" width="200" height="86" rx="10" fill="#fff" stroke="#93c5fd" stroke-dasharray="5 3"/>
    <text x="130" y="220" font-weight="700">Granular control</text>
    <text x="130" y="238" font-size="11" fill="#64748b">run any stage alone, hand-edit</text>
    <text x="130" y="252" font-size="11" fill="#64748b">spec / plan / scene files, then</text>
    <text x="130" y="266" font-size="11" fill="#64748b">resume from that point</text>

    <rect x="30" y="506" width="200" height="92" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.4"/>
    <text x="130" y="528" font-weight="700">config.py (changed)</text>
    <text x="130" y="546" font-size="11" fill="#64748b">backend_uri = localhost:8080</text>
    <text x="130" y="560" font-size="11" fill="#64748b">tokenizer = local path / HF cache</text>
    <text x="130" y="574" font-size="11" fill="#64748b">HF_HUB_OFFLINE=1 · no token at runtime</text>
  </g>

  <!-- ===== Col 2 ===== -->
  <rect x="290" y="104" width="400" height="562" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="490" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">goat_storytelling_agent  (Python process)</text>

  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="310" y="134" width="360" height="46" rx="8" fill="#ffedd5" stroke="#f97316"/>
    <text x="490" y="153" font-weight="700">StoryAgent  ·  orchestrator</text>
    <text x="490" y="169" font-size="11" fill="#64748b">generate_story(topic) with checkpointing after every stage</text>

    <rect x="310" y="192" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="209" font-weight="600">1 · init_book_spec</text><text x="490" y="224" font-size="11" fill="#64748b">genre, setting, tone, POV, characters, premise</text>

    <rect x="310" y="242" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="259" font-weight="600">2 · enhance_book_spec</text><text x="490" y="274" font-size="11" fill="#64748b">refine the spec</text>

    <rect x="310" y="292" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="309" font-weight="600">3 · create_plot_chapters</text><text x="490" y="324" font-size="11" fill="#64748b">acts → chapter outline</text>

    <rect x="310" y="342" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="359" font-weight="600">4 · enhance_plot_chapters</text><text x="490" y="374" font-size="11" fill="#64748b">refine the outline</text>

    <rect x="310" y="392" width="360" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="409" font-weight="600">5 · split_chapters_into_scenes</text><text x="490" y="424" font-size="11" fill="#64748b">scene cards: characters, place, event, conflict, mood</text>

    <rect x="310" y="442" width="360" height="40" rx="8" fill="#ffedd5" stroke="#f97316"/>
    <text x="490" y="459" font-weight="700">6 · write_a_scene  (loop)</text><text x="490" y="474" font-size="11" fill="#64748b">previous_scene context · continue_a_scene if cut off</text>

    <rect x="310" y="496" width="360" height="44" rx="8" fill="#ffedd5" stroke="#f97316"/>
    <text x="490" y="514" font-weight="700">Context manager (new, small-model aware)</text><text x="490" y="530" font-size="11" fill="#64748b">trims spec + plan + prior scenes to the local context size</text>

    <rect x="310" y="552" width="360" height="44" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="570" font-weight="600">Backend adapter: llama.cpp</text><text x="490" y="586" font-size="11" fill="#64748b">HTTP to the local server · retries and long timeouts</text>

    <rect x="310" y="608" width="360" height="44" rx="8" fill="#fff" stroke="#fdba74"/>
    <text x="490" y="626" font-weight="600">Tokenizer (offline)</text><text x="490" y="642" font-size="11" fill="#64748b">loaded from local files, no network calls</text>
  </g>
  <g stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M490,180 V191"/><path d="M490,232 V241"/><path d="M490,282 V291"/>
    <path d="M490,332 V341"/><path d="M490,382 V391"/><path d="M490,432 V441"/>
  </g>

  <!-- ===== Col 3 ===== -->
  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="760" y="108" width="324" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="922" y="130" font-weight="700" fill="#166534">Local project folder (new)</text>
    <text x="922" y="148" font-size="11" fill="#64748b">./story/&lt;title&gt;/</text>
    <text x="922" y="162" font-size="11" fill="#64748b">book_spec.json · plan.json</text>
    <text x="922" y="176" font-size="11" fill="#64748b">scenes/ch01_sc01.md …</text>
    <text x="922" y="190" font-size="11" fill="#64748b">checkpoints let a long run resume after a crash</text>

    <rect x="760" y="262" width="324" height="64" rx="10" fill="#fff" stroke="#16a34a"/>
    <text x="922" y="284" font-weight="700" fill="#166534">Final export</text>
    <text x="922" y="302" font-size="11" fill="#64748b">scenes stitched into story.md / .txt</text>
    <text x="922" y="315" font-size="11" fill="#64748b">full novel or novella on disk</text>

    <rect x="760" y="378" width="324" height="92" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
    <text x="922" y="400" font-weight="700" fill="#4c1d95">Model weights (GGUF) on disk</text>
    <text x="922" y="418" font-size="11" fill="#64748b">GOAT-70B-Storytelling, quantized (~40 GB at 4-bit)</text>
    <text x="922" y="432" font-size="11" fill="#64748b">or a smaller 8–14B instruct model on modest</text>
    <text x="922" y="446" font-size="11" fill="#64748b">hardware (lower quality on long-range consistency)</text>

    <rect x="760" y="494" width="324" height="92" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
    <text x="922" y="516" font-weight="700" fill="#4c1d95">llama.cpp server  ·  :8080</text>
    <text x="922" y="534" font-size="11" fill="#64748b">llama-server -m model.gguf -c 16384</text>
    <text x="922" y="548" font-size="11" fill="#64748b">large context flag matters for long prompts</text>
    <text x="922" y="562" font-size="11" fill="#64748b">Metal · CUDA · ROCm · CPU</text>
    <text x="922" y="576" font-size="11" fill="#64748b">(same API shape the repo already supports)</text>

    <rect x="760" y="606" width="324" height="60" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text x="922" y="628" font-weight="700">One-time setup only</text>
    <text x="922" y="646" font-size="11" fill="#64748b">download GGUF + tokenizer files from</text>
    <text x="922" y="659" font-size="11" fill="#64748b">Hugging Face, then disconnect</text>
  </g>

  <!-- ===== Arrows ===== -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M230,146 H308"/>
    <path d="M230,241 H308" stroke-dasharray="5 3"/>
    <path d="M230,552 H308"/>
    <path d="M670,157 H758"/>
    <path d="M670,462 H715 V294 H758"/>
    <path d="M670,574 H725 V548 H758"/>
    <path d="M922,494 V471"/>
  </g>
  <g font-size="11" fill="#334155">
    <text x="236" y="548">settings</text>
    <text x="680" y="150">save state</text>
    <text x="928" y="486" text-anchor="start" font-size="10.5">loads</text>
  </g>

  <!-- Bottom notes -->
  <text x="30" y="708" font-size="12" fill="#334155">Run: <tspan font-family="monospace" fill="#0f172a">llama-server -m goat-70b.Q4_K_M.gguf -c 16384 --port 8080</tspan>  →  <tspan font-family="monospace" fill="#0f172a">StoryAgent('http://localhost:8080', backend='llama.cpp', form='novel')</tspan></text>
  <text x="30" y="728" font-size="12" fill="#334155">Orange boxes are my proposed additions or changes; the six-stage pipeline itself is unchanged from the repo.</text>
  <text x="560" y="750" text-anchor="middle" font-size="11" fill="#94a3b8">Proposed offline setup for github.com/GOAT-AI-lab/GOAT-Storytelling-Agent</text>
</svg>
