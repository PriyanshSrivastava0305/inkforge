<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 750" width="1120" height="750" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1120" height="750" fill="#f8fafc"/>

  <text x="560" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">OpenWrite — Architecture</text>
  <text x="560" y="60" text-anchor="middle" font-size="13" fill="#64748b">Open-source AI writing platform · Bun monorepo · TypeScript end to end</text>

  <!-- ===== Column 1: Web ===== -->
  <rect x="30" y="90" width="270" height="410" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">apps/web — React SPA</text>
  <text x="165" y="128" text-anchor="middle" font-size="11" fill="#475569">React 19 · TanStack Router · Tailwind · shadcn/ui</text>

  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="48" y="142" width="234" height="40" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="160" font-weight="600">Auth &amp; Workspaces</text><text x="165" y="174" font-size="11" fill="#64748b">sign in / sign up, personal workspace</text>

    <rect x="48" y="192" width="234" height="40" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="210" font-weight="600">Projects &amp; Chapters</text><text x="165" y="224" font-size="11" fill="#64748b">genre, status, word-count goals, reorder</text>

    <rect x="48" y="242" width="234" height="40" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="260" font-weight="600">Tiptap Editor</text><text x="165" y="274" font-size="11" fill="#64748b">rich text · auto-save · live word count</text>

    <rect x="48" y="292" width="234" height="40" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="310" font-weight="600">Story Map Canvas</text><text x="165" y="324" font-size="11" fill="#64748b">premise → acts → chapters → scenes</text>

    <rect x="48" y="342" width="234" height="40" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="360" font-weight="600">Codex</text><text x="165" y="374" font-size="11" fill="#64748b">characters · locations · lore · plot points</text>

    <rect x="48" y="392" width="234" height="40" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="410" font-weight="600">AI Assistant Chat</text><text x="165" y="424" font-size="11" fill="#64748b">insert suggestions into manuscript</text>

    <rect x="48" y="442" width="234" height="40" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="165" y="460" font-weight="600">Settings &amp; Export</text><text x="165" y="474" font-size="11" fill="#64748b">provider API keys · Markdown export</text>
  </g>

  <!-- ===== Column 2: Cloudflare ===== -->
  <rect x="380" y="90" width="380" height="520" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="570" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Cloudflare — single deploy (wrangler)</text>

  <rect x="400" y="124" width="340" height="46" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="570" y="144" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Static frontend assets</text>
  <text x="570" y="160" text-anchor="middle" font-size="11" fill="#64748b">built apps/web served by the Worker</text>

  <rect x="400" y="184" width="340" height="288" rx="10" fill="#fff" stroke="#f97316" stroke-width="1.2"/>
  <text x="570" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3412">apps/server — Hono REST API</text>
  <text x="570" y="221" text-anchor="middle" font-size="11" fill="#64748b">Cloudflare Workers runtime</text>

  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="418" y="232" width="304" height="40" rx="8" fill="#ffedd5" stroke="#fdba74"/>
    <text x="570" y="249" font-weight="600">Middleware</text><text x="570" y="264" font-size="11" fill="#64748b">CORS · Better Auth session check</text>

    <rect x="418" y="282" width="304" height="52" rx="8" fill="#ffedd5" stroke="#fdba74"/>
    <text x="570" y="300" font-weight="600">Route handlers</text>
    <text x="570" y="316" font-size="11" fill="#64748b">projects · chapters · codex · story map</text>
    <text x="570" y="328" font-size="11" fill="#64748b">AI chat / expand · export</text>

    <rect x="418" y="344" width="148" height="50" rx="8" fill="#ffedd5" stroke="#fdba74"/>
    <text x="492" y="364" font-weight="600">AI client</text><text x="492" y="380" font-size="11" fill="#64748b">bring-your-own key</text>

    <rect x="574" y="344" width="148" height="50" rx="8" fill="#ffedd5" stroke="#fdba74"/>
    <text x="648" y="364" font-weight="600">Crypto</text><text x="648" y="380" font-size="11" fill="#64748b">AES-GCM · ENCRYPTION_KEY</text>

    <rect x="418" y="404" width="304" height="52" rx="8" fill="#ffedd5" stroke="#fdba74"/>
    <text x="570" y="424" font-weight="600">Drizzle ORM</text><text x="570" y="440" font-size="11" fill="#64748b">typed schema · bun db:push</text>
  </g>

  <!-- D1 -->
  <g>
    <path d="M400,520 v62 a170,12 0 0 0 340,0 v-62" fill="#fff" stroke="#f97316" stroke-width="1.2"/>
    <ellipse cx="570" cy="520" rx="170" ry="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.2"/>
    <text x="570" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Cloudflare D1 (SQLite)</text>
    <text x="570" y="566" text-anchor="middle" font-size="11" fill="#64748b">users · sessions · projects · chapters · codex · story nodes · encrypted keys</text>
  </g>

  <!-- ===== Column 3: AI providers ===== -->
  <rect x="830" y="90" width="260" height="410" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="960" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">External AI providers</text>
  <text x="960" y="128" text-anchor="middle" font-size="11" fill="#475569">called directly with the user's own key</text>

  <g font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="850" y="142" width="220" height="34" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="960" y="164">OpenRouter</text>
    <rect x="850" y="184" width="220" height="34" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="960" y="206">OpenAI</text>
    <rect x="850" y="226" width="220" height="34" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="960" y="248">Anthropic</text>
    <rect x="850" y="268" width="220" height="34" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="960" y="290">Groq</text>
    <rect x="850" y="310" width="220" height="34" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="960" y="332">Gemini</text>
    <rect x="850" y="352" width="220" height="34" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="960" y="374">Cohere</text>
    <rect x="850" y="418" width="220" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-dasharray="5 3"/>
    <text x="960" y="442">Ollama</text>
    <text x="960" y="460" font-size="11" font-weight="400" fill="#64748b">local models · fully private</text>
  </g>

  <!-- ===== Arrows ===== -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M300,147 H398"/>
    <path d="M300,340 H416"/>
    <path d="M722,340 H760 H828" />
    <path d="M570,456 V519"/>
  </g>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="349" y="140">load SPA</text>
    <text x="358" y="332">REST / JSON</text>
    <text x="795" y="330">HTTPS</text>
    <text x="795" y="354">user key</text>
    <text x="606" y="492">SQL</text>
  </g>

  <!-- ===== Tooling band ===== -->
  <text x="30" y="650" font-size="13" font-weight="700" fill="#0f172a">Repo &amp; tooling</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="30" y="662" width="165" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="112" y="684" font-weight="600">Bun workspaces</text><text x="112" y="701" font-size="11" fill="#64748b">apps/web · server · docs</text>
    <rect x="209" y="662" width="165" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="291" y="684" font-weight="600">mprocs</text><text x="291" y="701" font-size="11" fill="#64748b">dev TUI (web :3001, API :3000)</text>
    <rect x="388" y="662" width="165" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="470" y="684" font-weight="600">Vitest</text><text x="470" y="701" font-size="11" fill="#64748b">web + server unit tests</text>
    <rect x="567" y="662" width="165" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="649" y="684" font-weight="600">Playwright</text><text x="649" y="701" font-size="11" fill="#64748b">e2e suite</text>
    <rect x="746" y="662" width="165" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="828" y="684" font-weight="600">Biome + tsc</text><text x="828" y="701" font-size="11" fill="#64748b">bun quality</text>
    <rect x="925" y="662" width="165" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="1007" y="684" font-weight="600">apps/docs</text><text x="1007" y="701" font-size="11" fill="#64748b">VitePress documentation</text>
  </g>

  <text x="560" y="740" text-anchor="middle" font-size="11" fill="#94a3b8">Based on github.com/ilrein/openwrite README · AGPL-3.0</text>
</svg>
