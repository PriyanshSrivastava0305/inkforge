<rect x="48" y="28" width="8" height="58" rx="4" fill="#2563eb"/>
<text x="78" y="55" class="title">INKFORGE</text>
<text x="78" y="82" class="subtitle">Local-first AI writing system · visual planning + staged generation + continuity control</text>
