  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
    .title{font-size:34px;font-weight:800;letter-spacing:-.5px}
    .subtitle{font-size:16px;fill:#64748b}
    .laneTitle{font-size:17px;font-weight:800;letter-spacing:.7px;fill:#fff}
    .h{font-size:17px;font-weight:750}
    .p{font-size:13px;fill:#475569}
    .tiny{font-size:11px;fill:#64748b}
    .tag{font-size:11px;font-weight:750;letter-spacing:.5px}
    .panel{fill:#fff;stroke:#dbe3ef;stroke-width:1.5;rx:16;filter:url(#shadow)}
    .ui{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5;rx:13}
    .core{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5;rx:13}
