<text x="1860" y="527" text-anchor="end" font-size="12" fill="#d1fae5">Top-down planning · each stage produces a versioned artifact</text>

<!-- pipeline boxes -->
<g>
<rect x="56" y="570" width="202" height="112" class="pipe"/><circle cx="80" cy="594" r="13" fill="#047857"/><text x="80" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">1</text><text x="101" y="599" class="h">Book Spec</text><text x="72" y="625" class="p">Premise · genre · POV</text><text x="72" y="645" class="p">Tone · constraints · stakes</text><text x="72" y="666" class="tiny">book_spec.json</text>
<rect x="276" y="570" width="202" height="112" class="pipe"/><circle cx="300" cy="594" r="13" fill="#047857"/><text x="300" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">2</text><text x="321" y="599" class="h">Story Design</text><text x="292" y="625" class="p">Themes · arcs · acts</text><text x="292" y="645" class="p">Setups and payoffs</text><text x="292" y="666" class="tiny">story_design.json</text>
<rect x="496" y="570" width="202" height="112" class="pipe"/><circle cx="520" cy="594" r="13" fill="#047857"/><text x="520" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">3</text><text x="541" y="599" class="h">Chapter Plan</text><text x="512" y="625" class="p">Goal · conflict · turn</text><text x="512" y="645" class="p">Causal links · pacing</text><text x="512" y="666" class="tiny">outline.json</text>
<rect x="716" y="570" width="202" height="112" class="pipe"/><circle cx="740" cy="594" r="13" fill="#047857"/><text x="740" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">4</text><text x="761" y="599" class="h">Scene Cards</text><text x="732" y="625" class="p">Want · obstacle · change</text><text x="732" y="645" class="p">POV · cast · setting</text><text x="732" y="666" class="tiny">scenes/*.json</text>
<rect x="936" y="570" width="202" height="112" class="pipe"/><circle cx="960" cy="594" r="13" fill="#047857"/><text x="960" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">5</text><text x="981" y="599" class="h">Draft Scene</text><text x="952" y="625" class="p">Voice + relevant context</text><text x="952" y="645" class="p">Safe continuation</text><text x="952" y="666" class="tiny">scene version</text>
<rect x="1156" y="570" width="202" height="112" class="quality"/><circle cx="1180" cy="594" r="13" fill="#c2410c"/><text x="1180" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">6</text><text x="1201" y="599" class="h">Critique</text><text x="1172" y="625" class="p">Continuity · voice · craft</text><text x="1172" y="645" class="p">Evidence-linked findings</text><text x="1172" y="666" class="tiny">findings.json</text>
<rect x="1376" y="570" width="202" height="112" class="quality"/><circle cx="1400" cy="594" r="13" fill="#c2410c"/><text x="1400" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">7</text><text x="1421" y="599" class="h">Revise</text><text x="1392" y="625" class="p">Targeted edits · diffs</text><text x="1392" y="645" class="p">Re-check affected rules</text><text x="1392" y="666" class="tiny">new scene version</text>
<rect x="1596" y="570" width="268" height="112" class="pipe"/><circle cx="1620" cy="594" r="13" fill="#047857"/><text x="1620" y="598" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">8</text><text x="1641" y="599" class="h">Approve &amp; Export</text><text x="1612" y="625" class="p">Author approves canonical version</text><text x="1612" y="645" class="p">Markdown · DOCX · EPUB</text><text x="1612" y="666" class="tiny">release bundle + preflight report</text>
</g>
<g class="edge"><path d="M258 626 H271"/><path d="M478 626 H491"/><path d="M698 626 H711"/><path d="M918 626 H931"/><path d="M1138 626 H1151"/><path d="M1358 626 H1371"/><path d="M1578 626 H1591"/></g>
