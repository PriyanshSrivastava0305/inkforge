    .quality{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5;rx:13}
    .store{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:13}
    .local{fill:#172033;stroke:#172033;stroke-width:1.5;rx:13}
    .edge{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .edgeBlue{stroke:#2563eb;stroke-width:2.2;fill:none;marker-end:url(#arrowBlue)}
    .feedback{stroke:#8b5cf6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1920" height="1280" fill="url(#bg)"/>
<!-- Header -->
