<text x="58" y="357" class="laneTitle">02  APPLICATION CORE</text>
<text x="1860" y="357" text-anchor="end" font-size="12" fill="#e0e7ff">Typed domain services · durable jobs · controlled tool access</text>
<rect x="56" y="390" width="350" height="72" class="core"/>
<text x="76" y="416" class="h">Local API Gateway</text><text x="76" y="438" class="p">FastAPI · schema validation · job queue</text><text x="76" y="455" class="tiny">127.0.0.1 · REST + streaming events</text>
<rect x="426" y="390" width="430" height="72" class="core"/>
<text x="446" y="416" class="h">Conductor / Workflow Engine</text><text x="446" y="438" class="p">Stage state machine · retries · pause/resume</text><text x="446" y="455" class="tiny">Approval gates · checkpoint after each stage</text>
<rect x="876" y="390" width="430" height="72" class="core"/>
<text x="896" y="416" class="h">Context Builder + Prompt Registry</text><text x="896" y="438" class="p">Token budget · relevant Codex · versioned skills</text><text x="896" y="455" class="tiny">Context manifest saved with each generation</text>
<rect x="1326" y="390" width="538" height="72" class="core"/>
<text x="1346" y="416" class="h">Policy, Audit &amp; Workspace Guard</text><text x="1346" y="438" class="p">Path sandbox · audit events · atomic writes</text><text x="1346" y="455" class="tiny">No outbound network by default · confirm destructive changes</text>

