<text x="58" y="819" class="laneTitle">04  SHARED INTELLIGENCE SERVICES</text>
<rect x="56" y="854" width="372" height="160" class="quality"/>
<text x="78" y="882" class="h">Continuity &amp; Canon Engine</text><text x="78" y="907" class="p">• Timeline, ages, injuries, object states</text><text x="78" y="930" class="p">• Character knowledge and relationships</text><text x="78" y="953" class="p">• Setup/payoff and plot promise tracking</text><text x="78" y="976" class="p">• Findings cite both conflicting passages</text><text x="78" y="998" class="tiny">Rules first · local model for ambiguity</text>
<rect x="448" y="854" width="372" height="160" class="quality"/>
<text x="470" y="882" class="h">Voice &amp; Craft Critics</text><text x="470" y="907" class="p">• Per-character voice cards</text><text x="470" y="930" class="p">• Motivation, dialogue and POV drift</text><text x="470" y="953" class="p">• Pacing, clarity, repetition and payoff</text><text x="470" y="976" class="p">• Reader personas / rubric-based critique</text><text x="470" y="998" class="tiny">Advisory findings · author decides</text>
<rect x="840" y="854" width="394" height="160" class="quality"/>
<text x="862" y="882" class="h">Long-Book Memory</text><text x="862" y="907" class="p">CORE · stable facts always available</text><text x="862" y="930" class="p">DIGEST · chapter and arc summaries</text><text x="862" y="953" class="p">RECALL · lexical + optional vector retrieval</text><text x="862" y="976" class="p">Context manifest saved per model run</text><text x="862" y="998" class="tiny">Manuscript remains source of truth</text>

