<rect x="56" y="190" width="7" height="96" rx="3" fill="#3b82f6"/>
<text x="78" y="216" class="h">Visual Story Workbench</text><text x="78" y="239" class="p">Story graph · plot dependencies · timeline</text><text x="78" y="260" class="p">Drag/reorder acts, chapters and scene cards</text><text x="78" y="278" class="tiny">React + TypeScript · React Flow</text>
<rect x="496" y="190" width="420" height="96" class="ui"/>
<rect x="496" y="190" width="7" height="96" rx="3" fill="#3b82f6"/>
<text x="518" y="216" class="h">Manuscript Editor</text><text x="518" y="239" class="p">Markdown/rich text · autosave · version diffs</text><text x="518" y="260" class="p">Scene status · inline findings · approve/reject</text><text x="518" y="278" class="tiny">Tiptap or CodeMirror</text>
<rect x="936" y="190" width="420" height="96" class="ui"/>
<rect x="936" y="190" width="7" height="96" rx="3" fill="#3b82f6"/>
<text x="958" y="216" class="h">Codex / Project Bible</text><text x="958" y="239" class="p">Characters · locations · lore · relationships</text><text x="958" y="260" class="p">Canon facts linked to evidence in the manuscript</text><text x="958" y="278" class="tiny">Structured forms + cross-linked entity pages</text>
<rect x="1376" y="190" width="488" height="96" class="ui"/>
<rect x="1376" y="190" width="7" height="96" rx="3" fill="#3b82f6"/>
<text x="1398" y="216" class="h">CLI + Run Console</text><text x="1398" y="239" class="p">init · plan · draft · check · revise · export</text><text x="1398" y="260" class="p">Logs, progress, checkpoints, pause/resume/retry</text><text x="1398" y="278" class="tiny">Typer CLI · local events stream</text>

<!-- API layer -->
<rect x="36" y="330" width="1848" height="148" rx="20" fill="#fff" stroke="#dbe3ef"/>
<rect x="36" y="330" width="1848" height="42" rx="20" fill="#4338ca"/>
