<!-- Footer principles -->
<rect x="36" y="1060" width="1848" height="180" rx="20" fill="#172033"/>
<text x="62" y="1097" font-size="18" font-weight="800" fill="#fff">DESIGN GUARANTEES</text>
<line x1="62" y1="1112" x2="1856" y2="1112" stroke="#334155" stroke-width="1.5"/>
<circle cx="74" cy="1142" r="5" fill="#34d399"/><text x="90" y="1147" font-size="14" font-weight="700" fill="#f8fafc">Author owns canon</text><text x="90" y="1168" font-size="12" fill="#cbd5e1">No silent story changes</text>
<circle cx="510" cy="1142" r="5" fill="#60a5fa"/><text x="526" y="1147" font-size="14" font-weight="700" fill="#f8fafc">Recoverable workflow</text><text x="526" y="1168" font-size="12" fill="#cbd5e1">Versioned artifacts + resumable checkpoints</text>
<circle cx="1000" cy="1142" r="5" fill="#fbbf24"/><text x="1016" y="1147" font-size="14" font-weight="700" fill="#f8fafc">Evidence-based quality</text><text x="1016" y="1168" font-size="12" fill="#cbd5e1">Findings link back to source passages</text>
<circle cx="1460" cy="1142" r="5" fill="#c084fc"/><text x="1476" y="1147" font-size="14" font-weight="700" fill="#f8fafc">Offline by design</text><text x="1476" y="1168" font-size="12" fill="#cbd5e1">Local models, data and indexes</text>
<text x="62" y="1212" font-size="12" fill="#94a3b8">Build order: data contracts → checkpointed pipeline → local inference → quality engine → visual workbench → exports → offline hardening.</text>
<text x="1856" y="1212" text-anchor="end" font-size="12" fill="#94a3b8">INKFORGE · unified synthesis of visual planning, structured plotting, and autonomous writing QA</text>
