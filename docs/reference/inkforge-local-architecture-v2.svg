<circle cx="1557" cy="55" r="6" fill="#16a34a"/><text x="1574" y="60" font-size="13" font-weight="800" fill="#166534">LOCAL-ONLY RUNTIME</text>
<text x="1868" y="95" text-anchor="end" class="tiny">Reference architecture v2 · implementation target</text>

