<rect x="1580" y="854" width="284" height="72" class="store"/>
<text x="1598" y="880" class="h">Project Storage</text><text x="1598" y="901" class="p">Markdown + JSON + SQLite</text><text x="1598" y="917" class="tiny">Versions · checkpoints · audit · backups</text>
<rect x="1294" y="940" width="270" height="74" class="store"/>
<text x="1312" y="966" class="h">Local Search</text><text x="1312" y="987" class="p">SQLite FTS5 · optional FAISS</text><text x="1312" y="1004" class="tiny">Indexes are rebuildable</text>
<rect x="1580" y="940" width="284" height="74" class="local"/>
<text x="1598" y="966" font-size="16" font-weight="750" fill="#fff">Offline Boundary</text><text x="1598" y="987" font-size="12" fill="#e2e8f0">Loopback only · no cloud fallback</text><text x="1598" y="1004" font-size="11" fill="#cbd5e1">OS firewall for strict isolation</text>

