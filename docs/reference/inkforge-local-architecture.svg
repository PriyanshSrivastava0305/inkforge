<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
<defs>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
    .h1{font-size:32px;font-weight:750}.sub{font-size:15px;fill:#536178}
    .lane{font-size:18px;font-weight:750;fill:#fff}.head{font-size:16px;font-weight:700}
    .body{font-size:13px;fill:#334155}.small{font-size:11px;fill:#475569}
    .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12}
    .blue{fill:#eff6ff;stroke:#60a5fa}.purple{fill:#f5f3ff;stroke:#a78bfa}
    .green{fill:#ecfdf5;stroke:#34d399}.amber{fill:#fffbeb;stroke:#fbbf24}
    .red{fill:#fff1f2;stroke:#fb7185}.dark{fill:#172033;stroke:#172033}
    .line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
</defs>
<rect width="1800" height="1320" fill="#f8fafc"/>
<text x="48" y="52" class="h1">INKFORGE — Local-First Long-Form Writing Studio</text>
<text x="48" y="80" class="sub">Unified architecture: visual story graph + Codex · staged novel pipeline · autonomous orchestration · continuity and quality gates · fully local runtime</text>
<rect x="1430" y="28" width="320" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="1590" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">LOCAL-ONLY · OFFLINE-CAPABLE</text>

<!-- User experience lane -->
<rect x="35" y="105" width="1730" height="44" rx="10" fill="#334155"/><text x="55" y="133" class="lane">1 · EXPERIENCE LAYER — one local web app + CLI</text>
<rect x="45" y="165" width="390" height="125" class="box blue"/><text x="65" y="192" class="head">Visual Story Workbench</text><text x="65" y="216" class="body">Story-map node graph · arcs · dependencies</text><text x="65" y="237" class="body">Drag/reorder chapters and scene cards</text><text x="65" y="258" class="body">Plot promises · timeline · relationship graph</text><text x="65" y="278" class="small">React + TypeScript · graph canvas · local browser</text>
<rect x="455" y="165" width="390" height="125" class="box blue"/><text x="475" y="192" class="head">Manuscript Editor</text><text x="475" y="216" class="body">Rich-text / Markdown · autosave · versions</text><text x="475" y="237" class="body">Inline suggestions · accept/reject diffs</text><text x="475" y="258" class="body">Scene status · word counts · progress goals</text><text x="475" y="278" class="small">Tiptap or CodeMirror · local-first persistence</text>
<rect x="865" y="165" width="390" height="125" class="box blue"/><text x="885" y="192" class="head">Codex + Project Bible</text><text x="885" y="216" class="body">Characters · locations · lore · rules</text><text x="885" y="237" class="body">Voice cards · secrets · relationships · timeline</text><text x="885" y="258" class="body">Canon facts with source + confidence</text><text x="885" y="278" class="small">Structured forms + searchable entity pages</text>
<rect x="1275" y="165" width="480" height="125" class="box blue"/><text x="1295" y="192" class="head">CLI + Run Console</text><text x="1295" y="216" class="body">init · plan · run-stage · write-scene · check · export</text><text x="1295" y="237" class="body">Live stage events, logs, token/context estimates</text><text x="1295" y="258" class="body">Pause / resume / retry / approve generated changes</text><text x="1295" y="278" class="small">Typer CLI + local HTTP API · no remote dependency</text>

<!-- API &amp; orchestration -->
<rect x="35" y="315" width="1730" height="44" rx="10" fill="#334155"/><text x="55" y="343" class="lane">2 · APPLICATION CORE — typed domain services + event-driven orchestrator</text>
<rect x="45" y="375" width="300" height="140" class="box purple"/><text x="65" y="402" class="head">Local API Gateway</text><text x="65" y="426" class="body">FastAPI / REST + SSE events</text><text x="65" y="447" class="body">Project/workspace boundaries</text><text x="65" y="468" class="body">Validation · job queue · cancellation</text><text x="65" y="489" class="body">localhost binding by default</text>
<rect x="365" y="375" width="390" height="140" class="box purple"/><text x="385" y="402" class="head">Conductor / Workflow Engine</text><text x="385" y="426" class="body">Spec → outline → chapters → scenes → draft</text><text x="385" y="447" class="body">Enhance / revise / review / export stages</text><text x="385" y="468" class="body">Checkpoints after every stage; resumable jobs</text><text x="385" y="489" class="body">Human approval gates + deterministic retries</text>
<rect x="775" y="375" width="300" height="140" class="box purple"/><text x="795" y="402" class="head">Context Builder</text><text x="795" y="426" class="body">Budget-aware context packing</text><text x="795" y="447" class="body">Core memory + relevant Codex + retrieval</text><text x="795" y="468" class="body">Prior scenes summarized, not blindly appended</text><text x="795" y="489" class="body">Model-specific token counting + truncation</text>
<rect x="1095" y="375" width="300" height="140" class="box purple"/><text x="1115" y="402" class="head">Skill / Prompt Registry</text><text x="1115" y="426" class="body">Versioned prompt templates</text><text x="1115" y="447" class="body">YAML frontmatter + markdown skills</text><text x="1115" y="468" class="body">Genre structures and craft checklists</text><text x="1115" y="489" class="body">Reproducible prompt/model configuration</text>
<rect x="1415" y="375" width="340" height="140" class="box purple"/><text x="1435" y="402" class="head">Policy &amp; Safety Boundary</text><text x="1435" y="426" class="body">Filesystem sandbox + path validation</text><text x="1435" y="447" class="body">No outbound network by default</text><text x="1435" y="468" class="body">Audit trail · backup/restore · permissions</text><text x="1435" y="489" class="body">Explicit consent for destructive actions</text>

<!-- Pipeline -->
<rect x="35" y="540" width="1730" height="44" rx="10" fill="#334155"/><text x="55" y="568" class="lane">3 · STRUCTURED STORY PIPELINE — each stage is independently runnable and editable</text>
<g>
<rect x="45" y="600" width="200" height="100" class="box amber"/><text x="145" y="626" text-anchor="middle" class="head">A · Book Spec</text><text x="145" y="648" text-anchor="middle" class="body">Premise, genre, POV</text><text x="145" y="668" text-anchor="middle" class="body">tone, constraints, stakes</text><text x="145" y="686" text-anchor="middle" class="small">book_spec.json</text>
<rect x="265" y="600" width="200" height="100" class="box amber"/><text x="365" y="626" text-anchor="middle" class="head">B · Story Design</text><text x="365" y="648" text-anchor="middle" class="body">Themes, promises, arcs</text><text x="365" y="668" text-anchor="middle" class="body">acts, plot beats</text><text x="365" y="686" text-anchor="middle" class="small">story_design.json</text>
<rect x="485" y="600" width="200" height="100" class="box amber"/><text x="585" y="626" text-anchor="middle" class="head">C · Chapter Plan</text><text x="585" y="648" text-anchor="middle" class="body">Chapter goals + turns</text><text x="585" y="668" text-anchor="middle" class="body">cause/effect + pacing</text><text x="585" y="686" text-anchor="middle" class="small">outline.json</text>
<rect x="705" y="600" width="200" height="100" class="box amber"/><text x="805" y="626" text-anchor="middle" class="head">D · Scene Cards</text><text x="805" y="648" text-anchor="middle" class="body">Want, conflict, change</text><text x="805" y="668" text-anchor="middle" class="body">cast, setting, mood</text><text x="805" y="686" text-anchor="middle" class="small">scenes/*.json</text>
<rect x="925" y="600" width="200" height="100" class="box green"/><text x="1025" y="626" text-anchor="middle" class="head">E · Draft Scene</text><text x="1025" y="648" text-anchor="middle" class="body">Voice + local context</text><text x="1025" y="668" text-anchor="middle" class="body">continuation on truncation</text><text x="1025" y="686" text-anchor="middle" class="small">drafts/scene.md</text>
<rect x="1145" y="600" width="200" height="100" class="box green"/><text x="1245" y="626" text-anchor="middle" class="head">F · Critique</text><text x="1245" y="648" text-anchor="middle" class="body">Continuity, voice, craft</text><text x="1245" y="668" text-anchor="middle" class="body">reader panel + slop checks</text><text x="1245" y="686" text-anchor="middle" class="small">findings.json</text>
<rect x="1365" y="600" width="200" height="100" class="box green"/><text x="1465" y="626" text-anchor="middle" class="head">G · Revision</text><text x="1465" y="648" text-anchor="middle" class="body">Targeted edit proposals</text><text x="1465" y="668" text-anchor="middle" class="body">judge → revise → rejudge</text><text x="1465" y="686" text-anchor="middle" class="small">diff + revision history</text>
<rect x="1585" y="600" width="170" height="100" class="box green"/><text x="1670" y="626" text-anchor="middle" class="head">H · Export</text><text x="1670" y="648" text-anchor="middle" class="body">DOCX / EPUB / MD</text><text x="1670" y="668" text-anchor="middle" class="body">manuscript bundle</text><text x="1670" y="686" text-anchor="middle" class="small">release/</text>
</g>
<g class="line"><path d="M245 650 H260"/><path d="M465 650 H480"/><path d="M685 650 H700"/><path d="M905 650 H920"/><path d="M1125 650 H1140"/><path d="M1345 650 H1360"/><path d="M1565 650 H1580"/></g>
<text x="900" y="724" text-anchor="middle" class="small">Every stage can be run alone, inspected, edited by hand, and resumed from a saved checkpoint.</text>

<!-- quality -->
<rect x="35" y="745" width="1730" height="44" rx="10" fill="#334155"/><text x="55" y="773" class="lane">4 · QUALITY, MEMORY &amp; RETRIEVAL — shared services called throughout the pipeline</text>
<rect x="45" y="805" width="400" height="130" class="box red"/><text x="65" y="832" class="head">Continuity &amp; Canon Engine</text><text x="65" y="856" class="body">Character facts, ages, injuries, knowledge states</text><text x="65" y="877" class="body">Timeline, geography, objects, plot promises</text><text x="65" y="898" class="body">Contradiction candidates with evidence links</text><text x="65" y="918" class="small">Rule checks first; local LLM adjudicates ambiguity</text>
<rect x="465" y="805" width="400" height="130" class="box red"/><text x="485" y="832" class="head">Character &amp; Voice Critics</text><text x="485" y="856" class="body">Per-character persona cards + speech patterns</text><text x="485" y="877" class="body">Dialogue attribution and voice drift checks</text><text x="485" y="898" class="body">Scene-level goal / motivation consistency</text><text x="485" y="918" class="small">Findings cite chapter/scene and supporting text</text>
<rect x="885" y="805" width="400" height="130" class="box red"/><text x="905" y="832" class="head">Tiered Long-Book Memory</text><text x="905" y="856" class="body">CORE: stable facts always included</text><text x="905" y="877" class="body">DIGEST: chapter / arc summaries</text><text x="905" y="898" class="body">RECALL: lexical + vector retrieval on demand</text><text x="905" y="918" class="small">Raw manuscript on disk remains source of truth</text>
<rect x="1305" y="805" width="450" height="130" class="box red"/><text x="1325" y="832" class="head">Evaluation &amp; Learning Loop</text><text x="1325" y="856" class="body">Craft rubric · pacing · payoff · readability</text><text x="1325" y="877" class="body">Synthetic reader personas + title/blurb tests</text><text x="1325" y="898" class="body">Store accepted lessons; never silently alter canon</text><text x="1325" y="918" class="small">Metrics are advisory; author makes final decisions</text>

<!-- local runtime and storage -->
<rect x="35" y="960" width="1730" height="44" rx="10" fill="#334155"/><text x="55" y="988" class="lane">5 · LOCAL INFRASTRUCTURE — zero cloud dependency at runtime</text>
<rect x="45" y="1020" width="400" height="130" class="box green"/><text x="65" y="1047" class="head">Local Model Router</text><text x="65" y="1071" class="body">Ollama default · llama.cpp / LM Studio adapters</text><text x="65" y="1092" class="body">Model profiles per task: plan / prose / judge</text><text x="65" y="1113" class="body">Health checks, timeouts, queue, context limits</text><text x="65" y="1133" class="small">OpenAI-compatible localhost API; model weights on disk</text>
<rect x="465" y="1020" width="400" height="130" class="box green"/><text x="485" y="1047" class="head">Workspace Storage</text><text x="485" y="1071" class="body">Markdown drafts + JSON source-of-truth records</text><text x="485" y="1092" class="body">SQLite metadata · migrations · file-backed assets</text><text x="485" y="1113" class="body">Version snapshots · backups · resumable checkpoints</text><text x="485" y="1133" class="small">./workspace/{projects,models-cache,exports,logs}</text>
<rect x="885" y="1020" width="400" height="130" class="box green"/><text x="905" y="1047" class="head">Search Indexes</text><text x="905" y="1071" class="body">SQLite FTS5 for exact/lexical search</text><text x="905" y="1092" class="body">Optional local embeddings + vector index</text><text x="905" y="1113" class="body">Rebuildable indexes; no irreplaceable data here</text><text x="905" y="1133" class="small">Index only approved project-local documents</text>
<rect x="1305" y="1020" width="450" height="130" class="box dark"/><text x="1325" y="1047" font-size="16" font-weight="700" fill="#fff">Offline / Security Controls</text><text x="1325" y="1071" font-size="13" fill="#e2e8f0">Bind 127.0.0.1 · outbound network disabled by default</text><text x="1325" y="1092" font-size="13" fill="#e2e8f0">No API keys · no telemetry · no external calls</text><text x="1325" y="1113" font-size="13" fill="#e2e8f0">Optional OS-level firewall / container network=none</text><text x="1325" y="1133" font-size="11" fill="#cbd5e1">Download models once, then operate disconnected</text>

<!-- arrows vertical / footer -->
<path class="line" d="M900 290 V307"/><path class="line" d="M900 515 V532"/><path class="line" d="M900 700 V737"/><path class="line" d="M900 935 V952"/>
<rect x="45" y="1180" width="1710" height="100" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="65" y="1208" class="head">Build principle</text><text x="65" y="1232" class="body">Deterministic code owns state, schemas, checkpoints, exports, rule-based validation and audit logs. The local LLM proposes plans, prose and judgments;</text><text x="65" y="1254" class="body">it never silently overwrites canon. Every generated artifact is inspectable, versioned, editable and reproducible from saved inputs/configuration.</text>
<text x="1750" y="1300" text-anchor="end" class="small">INKFORGE reference architecture · v1.0 · proposed synthesis of the three supplied designs</text>
</svg>