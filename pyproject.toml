[project]
name = "inkforge"
version = "0.0.1"
description = "Local-first story and script writing agent (personal tool)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
tokenizer = [
    "tokenizers>=0.19",
    "gguf>=0.10",
]

[project.scripts]
inkforge = "inkforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkforge"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # typographic quotes/dashes are intentional in a writing tool

[tool.ruff.lint.per-file-ignores]
"src/inkforge/cli.py" = ["B008"]
"src/inkforge/cli_pipeline.py" = ["B008"]  # typer.Option()/Argument() defaults are the Typer idiom

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ollama: needs a running local Ollama with the D16 models (deselect with -m 'not ollama')",
    "slow: multi-process chaos tests (~1-2 min); excluded from the pre-commit hook",
]
