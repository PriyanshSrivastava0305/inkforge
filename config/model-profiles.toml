# Default model profiles (decision D16). One model serves every role.
# Only the models listed in [runtime].allowed_models may be referenced.

[runtime]
adapter = "ollama"
base_url = "http://127.0.0.1:11434"   # loopback only (D2/D18)
max_loaded_models = 1                 # 16 GB RAM: never keep 1B and 8B resident together
keep_alive = "15m"
allowed_models = [
    "llama3.1:8b-instruct-q4_K_M",
    "llama3.2:1b",
    "nomic-embed-text",
]
min_version = "0.34.0"        # tested 2026-10-09

[runtime.tokenizer_family]    # cached by scripts/build_tokenizer.py
"llama3.1:8b-instruct-q4_K_M" = "llama3"
"llama3.2:1b" = "llama3"

[profiles.planner]
model = "llama3.1:8b-instruct-q4_K_M"
num_ctx = 6144
temperature = 0.4
output_fraction = 0.3

[profiles.prose]
model = "llama3.1:8b-instruct-q4_K_M"
num_ctx = 6144
temperature = 0.85
top_p = 0.92
repeat_penalty = 1.08
min_output_tokens = 1500
# llama3.1 8B ends long scenes early: 635, 865, 704 and 753 words for a 1,200-word target (2026-10-12/13),
# but hits ~450-word targets. Ask for 1.4x above 700 words; draft checks still compare with the real target.
long_scene_factor = 1.4

[profiles.critic]
model = "llama3.1:8b-instruct-q4_K_M"
num_ctx = 6144
temperature = 0.1
timeout_s = 1200

[profiles.embedding]
model = "nomic-embed-text"
enabled = false
